name = "Basic"
description = "Classic dev flow: spec → plan → implement → review → squash-merge."

[[stage]]
id = "orchestrate"
label = "Orchestrate (auto-drive)"
default_enabled = false
prompt = "Have the orchestrator agent pick this card up and drive it to done autonomously, running the card's pipeline stages in order — regardless of which board column the card is in (it may be started even from Todo)."

[[stage]]
id = "spec"
label = "Create spec"
default_enabled = true
prompt = "FIRST, check the card description: if it already contains the full spec — meaning `### Outcome`, `### Scope`, and `### Testing & acceptance criteria` EACH occur at the START of a line (prefix match, so `### Outcome — what's different when this is done` counts), and NOT inside a fenced code block or a block quote; ALL THREE are required and if any one is missing take the OTHERWISE path — then copy it through instead of writing one from scratch: write `SPEC.md` at the workspace root as exactly the line `## Task: <the card's title, verbatim>`, then a blank line, then the card description verbatim (the description does NOT carry the title — it begins at the `**In one sentence:**` line — so reconstruct that first line from the card's title field). Strip the `## Pipeline` block from the body, anchored to STANDALONE marker lines: take the LAST line whose entire content is exactly `<!-- vk:pipeline:start -->`, and the first line after it whose entire content is exactly `<!-- vk:pipeline:end -->`, and delete everything between them including both marker lines. A marker mentioned inside a prose line is not a delimiter — leave that line alone, since a spec may legitimately quote the markers while describing them. Then collapse the blank run the strip leaves behind so the file ends with a single trailing newline. Also sweep out any stray executor-pin bullet (a line matching `- Run this card with the ... execution agent: pass ...`) left outside the block — it normally sits inside the block and goes with it, so this is just a safety net. Do not edit, re-author, or re-verify the copied text: adopt the card's decisions as settled. Then report \"spec adopted from card description\". (The card description is already in your task context; if you were given only the card title/id, `get_issue` the card to fetch it.) OTHERWISE: Write a technical spec for this card and save it to `SPEC.md` at the workspace root (one level above the repo, next to `CLAUDE.md` — never inside the repo) before implementing."

[[stage]]
id = "plan"
label = "Create plan"
default_enabled = true
prompt = "Write a step-by-step implementation plan and save it to `IMPLEMENTATION_PLAN.md` at the workspace root (one level above the repo, next to `CLAUDE.md` — never inside the repo)."

[[stage]]
id = "plan-review"
label = "Review plan"
default_enabled = false
prompt = "Have the implementation plan reviewed (e.g. a codex plan review, read-only) and resolve blockers before writing code."

[[stage]]
id = "wait-for-approval"
label = "Wait for approval"
default_enabled = false
prompt = "Pause for operator approval at this point: commit the work so far, then stop and wait for the operator's decision or instructions before continuing to later stages — do not advance on your own until the operator responds."

[[stage]]
id = "code-review"
label = "Review via Codex"
default_enabled = true
prompt = "After implementing, run an independent Codex review of the card's diff (the `codex-review` skill / Codex CLI), iterating until it reports no significant findings. Address confirmed findings and re-verify before marking the card ready."

[[stage]]
id = "update-docs"
label = "Update documentation"
default_enabled = false
prompt = "Update the documentation affected by this change so the docs match what shipped, and commit it before marking the card ready."

[[stage]]
id = "merge"
label = "Squash-merge to base"
default_enabled = true
prompt = "Squash-merge this card's branch into the base branch yourself once the build passes — this stage being listed is your authorization, so do not wait for a go-ahead; gating, when wanted, is the Wait-for-approval stage's job. TWO HARD FACTS: (a) you are in a linked worktree, so `git checkout main` CANNOT work — never try it; (b) other lanes merge into the same base concurrently, so a 2-arg `git update-ref refs/heads/main $NEW` is a blind overwrite that SILENTLY CLOBBERS their commits — the 3-arg compare-and-swap is the correctness backstop (it turns a concurrent merge into a failed update you retry, never a lost one), and the /tmp/vk-merge-lock mutex below is best-effort serialization only: it guarantees nothing. PROCEDURE, per repo you merge, with BASE set to this card's base branch (usually main) and `repo=$(basename \"$(git rev-parse --show-toplevel)\")`: (1) LOCK — best-effort and BOUNDED, so a leaked lock cannot wedge you: try up to 60 times to `mkdir \"/tmp/vk-merge-lock-$repo\"`, sleeping 10s between tries, and once you hold it `trap 'rmdir \"/tmp/vk-merge-lock-$repo\" 2>/dev/null' EXIT INT TERM`. If you never get it you MAY proceed without it — the compare-and-swap makes the worst case a failed merge you retry, never a lost commit — but say so in your report. (2) MERGE — loop at most 5 attempts: pin the base you are merging onto with `OLD=$(git rev-parse --verify \"refs/heads/$BASE^{commit}\")`, written exactly that way — fully qualified through `refs/heads/`, NOT a bare `git rev-parse \"$BASE\"` — because git resolves a short name by checking `refs/tags/` BEFORE `refs/heads/`, so a tag sharing the branch name would pin the TAG, and the pin MUST name the same ref the compare-and-swap below updates or the CAS fails every single time while reporting itself as the retryable race. Then run `git rebase \"$OLD\"`, and if it conflicts, resolve the conflicted paths, `git add` them, then run `git rebase --continue`, repeating until the rebase completes — during a rebase you do NOT run `git commit`, you never run `git rebase --skip`, and you never force anything; if a conflict cannot be resolved, run `git rebase --abort`, report it, and stop. RE-RUN THE BUILD AND TESTS HERE, because a clean rebase is NOT a passing build. Mint the squash commit with `NEW=$(git commit-tree \"HEAD^{tree}\" -p \"$OLD\" -m \"CARD-ID: one-line summary\")`, then land it with the 3-arg compare-and-swap `git update-ref -m \"CARD-ID: squash merge\" \"refs/heads/$BASE\" \"$NEW\" \"$OLD\"`. A SUCCESSFUL 3-ARG update-ref IS AUTHORITATIVE: the moment it exits 0 you HAVE LANDED — break out of the loop, NEVER retry after a successful compare-and-swap, and never re-open the loop, because re-rebasing commits that are already applied would mint an EMPTY DUPLICATE commit. On failure, MATCH THE ERROR PRECISELY: only an error containing `is at ... but expected` is the race (the base moved) — re-pin OLD the same fully-qualified way, re-rebase, re-run the build, re-mint the commit, and retry. Any other failure is NOT a race and must be surfaced rather than retried — in particular `reference is missing but expected` means the ref was DELETED. If all 5 attempts fail, report that the base kept moving and stop: NEVER fake success. (3) VERIFY BY ANCESTRY, never by tip equality: run `git merge-base --is-ancestor \"$NEW\" \"refs/heads/$BASE\"` and require exit 0 — that is the ONLY pass/fail gate, and it is MONOTONIC: once true it stays true forever, no matter how many other lanes land on top of you afterwards. Do NOT gate on `git log --oneline $BASE -1` showing your commit, and do NOT gate on `git diff $BASE HEAD` being empty: both compare against the MOVING TIP, so a concurrent lane landing microseconds after your successful compare-and-swap makes them false even though your merge landed perfectly — and acting on that false negative would send you back through the loop to mint an empty duplicate commit. You MAY print `git log --oneline $BASE -3` as a human-readable sanity check, but it is NOT the gate. Local only — do NOT `git push`, do NOT open a PR. Report that you squash-merged to the base branch, with the SHA."

[[stage]]
id = "pr"
label = "Open pull request"
default_enabled = false
prompt = "When the work is implemented and reviewed, open a pull request for this card against the base branch."
