name: Release indie (npm + GitHub binaries)

# Builds and publishes ONLY when a version tag is pushed (e.g. `v0.1.0`).
# Ordinary commits/pushes do nothing. The release tag must equal the npm version
# in npx-cli/package.json (`v<version>`), which is also how the CLI derives the
# binary download URL at runtime (see npx-cli/src/download.ts).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # run manually against a tag ref

permissions:
  contents: write # create the GitHub Release + upload assets

concurrency:
  group: release-indie-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Indie fork is local-only; no shared cloud API. Keep frontend build offline.
  VITE_VK_SHARED_API_BASE: ""
  VK_SHARED_API_BASE: ""
  # Must match rust-toolchain.toml — otherwise the toolchain file overrides
  # whatever the action installs and the requested matrix target is missing.
  RUST_TOOLCHAIN: stable
  # Pin zig so transient mirror 404s don't break the linux-musl matrix legs.
  ZIG_VERSION: "0.13.0"

jobs:
  # 1) Build the web app once; the `server` binary embeds it.
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vibe/local-web run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: packages/local-web/dist
          if-no-files-found: error
          retention-days: 1

  # 2) Cross-compile the three CLI binaries for all 6 targets.
  build-binaries:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, platform: linux-x64, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, platform: linux-arm64, zig: true }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: macos-arm64, zig: false }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: macos-x64, zig: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x64, zig: false }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, platform: windows-arm64, zig: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - if: matrix.zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Restore the embedded web assets the server binary expects.
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: packages/local-web/dist

      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }} --bin server --bin vibe-kanban-mcp --bin review

      - name: Build (native)
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }} --bin server --bin vibe-kanban-mcp --bin review

      # Package each binary as <base>-<platform>.zip, where the entry inside the
      # zip is the bare binary name the CLI extracts and runs.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          T="${{ matrix.target }}"; P="${{ matrix.platform }}"
          mkdir -p dist-assets
          cp "target/$T/release/server" vibe-kanban
          zip -q "dist-assets/vibe-kanban-$P.zip" vibe-kanban && rm vibe-kanban
          cp "target/$T/release/vibe-kanban-mcp" vibe-kanban-mcp
          zip -q "dist-assets/vibe-kanban-mcp-$P.zip" vibe-kanban-mcp && rm vibe-kanban-mcp
          cp "target/$T/release/review" vibe-kanban-review
          zip -q "dist-assets/vibe-kanban-review-$P.zip" vibe-kanban-review && rm vibe-kanban-review
          ls -la dist-assets

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $T = "${{ matrix.target }}"; $P = "${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path dist-assets | Out-Null
          Copy-Item "target/$T/release/server.exe" "vibe-kanban.exe"
          Compress-Archive -Force -Path "vibe-kanban.exe" -DestinationPath "dist-assets/vibe-kanban-$P.zip"
          Remove-Item "vibe-kanban.exe"
          Copy-Item "target/$T/release/vibe-kanban-mcp.exe" "vibe-kanban-mcp.exe"
          Compress-Archive -Force -Path "vibe-kanban-mcp.exe" -DestinationPath "dist-assets/vibe-kanban-mcp-$P.zip"
          Remove-Item "vibe-kanban-mcp.exe"
          Copy-Item "target/$T/release/review.exe" "vibe-kanban-review.exe"
          Compress-Archive -Force -Path "vibe-kanban-review.exe" -DestinationPath "dist-assets/vibe-kanban-review-$P.zip"
          Remove-Item "vibe-kanban-review.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.platform }}
          path: dist-assets/*.zip
          if-no-files-found: error
          retention-days: 1

  # 3) Build manifest.json (checksums) and publish the GitHub Release.
  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: assets
          merge-multiple: true

      - name: Generate manifest.json
        run: |
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto");
            const dir = "assets";
            const version = (process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
            const platforms = ["linux-x64","linux-arm64","macos-x64","macos-arm64","windows-x64","windows-arm64"];
            const out = { latest: version, platforms: {} };
            for (const f of fs.readdirSync(dir)) {
              if (!f.endsWith(".zip")) continue;
              const name = f.slice(0, -4);
              const plat = platforms.find((p) => name.endsWith("-" + p));
              if (!plat) { console.error("skip (unknown platform):", f); continue; }
              const base = name.slice(0, name.length - plat.length - 1);
              const buf = fs.readFileSync(path.join(dir, f));
              const sha256 = crypto.createHash("sha256").update(buf).digest("hex");
              (out.platforms[plat] ||= {})[base] = { sha256, size: buf.length };
            }
            fs.writeFileSync(path.join(dir, "manifest.json"), JSON.stringify(out, null, 2));
            console.log(JSON.stringify(out, null, 2));
          '

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Prerelease tags (e.g. v0.2.8-beta.1) become GitHub pre-releases so the
          # CLI's releases/latest manifest pointer stays on the last stable build.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            assets/*.zip
            assets/manifest.json
          fail_on_unmatched_files: true

  # 4) Publish the CLI wrapper to npm. NOTE: no local-build.sh here, so the
  #    tarball ships only bin/ (no dist/) and runs in remote-download mode.
  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing (no NPM_TOKEN needed)
    defaults:
      run:
        working-directory: npx-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1, newer than setup-node ships.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Guard — version matches tag and no bundled dist
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::npx-cli version ($PKG) != tag ($TAG). Bump npx-cli/package.json before tagging."
            exit 1
          fi
          if [ -d dist ]; then
            echo "::error::dist/ present — would flip users into LOCAL_DEV_MODE. Do not build local-build.sh in this job."
            exit 1
          fi
          # Derive the npm dist-tag from the version so prereleases never clobber
          # @latest. stable X.Y.Z -> latest ; X.Y.Z-beta.N -> beta ; -rc.N -> rc.
          if [[ "$PKG" == *-* ]]; then
            PRE="${PKG#*-}"          # e.g. beta.1
            NPM_TAG="${PRE%%.*}"     # e.g. beta
          else
            NPM_TAG="latest"
          fi
          echo "NPM_DIST_TAG=$NPM_TAG" >> "$GITHUB_ENV"
          echo "Publishing $PKG to npm dist-tag: $NPM_TAG"

      - run: npm ci
      - run: npm run build
      # No NODE_AUTH_TOKEN: npm authenticates via OIDC (trusted publisher must be
      # configured on npmjs.com for this package + workflow) and auto-attaches
      # build provenance.
      - run: npm publish --access public --tag "$NPM_DIST_TAG"
