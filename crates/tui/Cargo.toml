[package]
name = "tui"
version = "0.2.6"
edition = "2024"

[[bin]]
name = "vibe-tui"
path = "src/main.rs"

[dependencies]
# Real wire types for the safety-critical approval write-path, the LogMsg WS
# envelope, port discovery, and the ApiResponse envelope. Avoids depending on the
# heavy db/executors/services crates (sqlx macros, codex git deps) — display
# payloads are mirrored locally in `api::types` instead.
utils = { path = "../utils" }

# Async runtime + terminal UI
tokio = { workspace = true }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# HTTP + WebSocket transport to the backend
reqwest = { workspace = true }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
rustls = { workspace = true }

# Serde + RFC6902 patch application (same major as `executors`/`services`)
serde = { workspace = true }
serde_json = { workspace = true }
json-patch = "2.0"

uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
